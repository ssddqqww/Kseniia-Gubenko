  <body class="contact-page">
    <div class="page-transition" aria-hidden="true" data-page-transition><span></span><span></span><span></span><span></span><span></span><span></span><div class="transition-switch"><b>Professional</b><b>Contact</b></div></div>
    <header class="site-header" data-header>
      <a class="brand" href="index.html" data-transition-link>Kseniia <i>.</i></a>
      <nav class="site-nav" aria-label="Main navigation"><a href="index.html" data-transition-link>Professional</a><a href="personal.html" data-transition-link>Personal</a><a class="active" href="contact.html">Contact</a></nav>
      <button class="language-pill" type="button" aria-label="Current language: English"><span aria-hidden="true">◎</span> English <i aria-hidden="true">⌄</i></button>
      <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" data-menu-toggle><span></span><span></span></button>
    </header>
    <div class="mobile-menu" data-mobile-menu><a href="index.html" data-transition-link>Professional</a><a href="personal.html" data-transition-link>Personal</a><a href="contact.html">Contact</a></div>
    <main class="contact-page-main">
      <div class="contact-page-grid" aria-hidden="true"></div>
      <section class="contact-form-shell shell">
        <div class="contact-form-heading"><p>Start a conversation</p><h1>Get in <span>Touch</span></h1><p>Tell me what you are building, researching, or exploring. I usually reply by email.</p></div>
        <form class="contact-form" action="https://formsubmit.co/ajax/kssgubenko@gmail.com" method="POST" data-contact-form>
          <input type="hidden" name="_subject" value="New portfolio message" />
          <input type="hidden" name="_captcha" value="false" />
          <label><span>Name</span><input name="name" type="text" placeholder="Your name" autocomplete="name" required /></label>
          <label><span>Email address</span><input name="email" type="email" placeholder="you@example.com" autocomplete="email" required /></label>
          <label class="message-field"><span>Message</span><textarea name="message" rows="7" placeholder="What would you like to talk about?" required></textarea></label>
          <button type="submit" data-contact-submit><span>Send email</span><b>→</b></button>
          <p class="form-status" role="status" aria-live="polite" data-form-status></p>
        </form>
        <div class="contact-direct"><a href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=kssgubenko@gmail.com" target="_blank" rel="noreferrer">Gmail: kssgubenko@gmail.com</a><div><a href="https://www.linkedin.com/in/kseniia-gubenko-70aa6b363/" target="_blank" rel="noreferrer">LinkedIn</a><a href="#" data-social-placeholder>Instagram</a><a href="https://github.com/ssddqqww" target="_blank" rel="noreferrer">GitHub</a></div></div>
